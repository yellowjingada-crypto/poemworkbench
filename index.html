function fmt(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function todayStr(){ return fmt(new Date()); }
function addDays(base, n){
  var p = base.split('-');
  var d = new Date(+p[0], +p[1] - 1, +p[2]);
  d.setDate(d.getDate() + n);
  return fmt(d);
}
function diffDays(a, b){
  var pa = a.split('-'), pb = b.split('-');
  var da = new Date(+pa[0], +pa[1] - 1, +pa[2]);
  var db = new Date(+pb[0], +pb[1] - 1, +pb[2]);
  return Math.round((db - da) / 86400000);
}
function cnDate(s){
  var p = s.split('-');
  return (+p[1]) + '月' + (+p[2]) + '日';
}
function esc(s){
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function byId(id){ return document.getElementById(id); }
function findPoem(id){
  for (var i = 0; i < POEMS.length; i++) if (POEMS[i].id === id) return POEMS[i];
  return null;
}

/* ============ 状态 ============ */
var state = { learned: {}, q: '', filter: 'all', openId: null, showPy: true, showTr: true, demo: false };

function loadState(){
  var raw = null;
  try { raw = localStorage.getItem(KEY); } catch (e) { raw = null; }
  if (!raw) { seedDemo(); return; }
  try {
    var d = JSON.parse(raw);
    state.learned = d.learned || {};
    state.demo = !!d.demo;
    // 清理失效 id
    var valid = {};
    for (var k in state.learned) {
      if (findPoem(+k)) valid[k] = normEntry(state.learned[k]);
    }
    state.learned = valid;
  } catch (e) {
    seedDemo();
  }
}

function saveState(){
  try {
    localStorage.setItem(KEY, JSON.stringify({ learned: state.learned, demo: state.demo, v: 1 }));
  } catch (e) {}
}

/* 首次打开：预置示例数据（含 1 条逾期） */
function seedDemo(){
  var t = todayStr();
  state.learned = {};
  // 静夜思：逾期 2 天
  state.learned[3] = { added: addDays(t, -9), stage: 2, reviews: 2, last: addDays(t, -6), next: addDays(t, -2) };
  // 春晓：今天到期
  state.learned[2] = { added: addDays(t, -3), stage: 1, reviews: 1, last: addDays(t, -2), next: t };
  // 咏鹅：明天到期（已掌握状态演示）
  state.learned[1] = { added: addDays(t, -12), stage: 4, reviews: 4, last: addDays(t, -5), next: addDays(t, 3) };
  state.demo = true;
  saveState();
}

/* ============ 业务计算（纯函数） ============ */
function entryOf(id){ return state.learned[id] || null; }

/* 规范化一条学习记录（兼容旧数据 / 导入文件） */
function normEntry(v){
  v = v || {};
  var t = todayStr();
  var s = typeof v.stage === 'number' ? Math.max(0, Math.min(5, v.stage)) : 0;
  return {
    added: typeof v.added === 'string' ? v.added : t,
    stage: s,
    reviews: typeof v.reviews === 'number' ? v.reviews : 0,
    last: typeof v.last === 'string' ? v.last : null,
    next: typeof v.next === 'string' ? v.next : addDays(t, 1)
  };
}

function reviewQueue(){
  var t = todayStr(), out = [];
  for (var k in state.learned) {
    var e = state.learned[k];
    if (e.next <= t) {
      var p = findPoem(+k);
      if (!p) continue;
      out.push({ poem: p, entry: e, overdue: diffDays(e.next, t) });
    }
  }
  out.sort(function(a, b){ return a.entry.next < b.entry.next ? -1 : (a.entry.next > b.entry.next ? 1 : 0); });
  return out;
}

function counts(){
  var learned = 0, master = 0, t = todayStr(), due = 0;
  for (var k in state.learned) {
    learned++;
    if (state.learned[k].stage >= 4) master++;
    if (state.learned[k].next <= t) due++;
  }
  return { learned: learned, master: master, due: due };
}

function searchResult(){
  var q = state.q.trim().toLowerCase();
  var out = [];
  for (var i = 0; i < POEMS.length; i++) {
    var p = POEMS[i];
    if (state.filter === 'learned' && !state.learned[p.id]) continue;
    if (state.filter === 'master' && !(state.learned[p.id] && state.learned[p.id].stage >= 4)) continue;
    if (state.filter === '小学' && p.lv !== '小学') continue;
    if (state.filter === '初中' && p.lv !== '初中') continue;
    if (!q) { out.push(p); continue; }
    var hay = (p.t + p.a + p.d + p.lines.join('')).toLowerCase();
    if (hay.indexOf(q) >= 0) out.push(p);
  }
  return out;
}

function hl(text, q){
  if (!q) return esc(text);
  var idx = text.toLowerCase().indexOf(q.toLowerCase());
  if (idx < 0) return esc(text);
  return esc(text.slice(0, idx)) + '<mark>' + esc(text.slice(idx, idx + q.length)) + '</mark>' + esc(text.slice(idx + q.length));
}

/* ============ 渲染 ============ */
function renderNav(){
  var c = counts();
  var badge = byId('navBadge'), tab = byId('tabBadge');
  if (c.due > 0) {
    badge.style.display = 'inline-block'; badge.textContent = c.due;
    tab.style.display = 'inline-block'; tab.textContent = c.due;
  } else {
    badge.style.display = 'none'; tab.style.display = 'none';
  }
}

function renderToday(){
  var t = todayStr();
  var d = new Date();
  var wk = ['日', '一', '二', '三', '四', '五', '六'][d.getDay()];
  byId('greetSub').textContent = t.replace(/-/g, ' / ') + ' 星期' + wk;

  var c = counts();
  byId('statDue').innerHTML = c.due + '<small>首</small>';
  byId('statLearned').innerHTML = c.learned + '<small>首</small>';
  byId('statMaster').innerHTML = c.master + '<small>首</small>';

  byId('demoTip').style.display = (state.demo && c.learned > 0) ? 'flex' : 'none';

  var q = reviewQueue();
  var box = byId('reviewList');
  if (!q.length) {
    box.innerHTML = '<div class="card empty"><h3>今天的复习任务清空了</h3>' +
      '<p>去「查找诗词」里挑一首，加入题库后会自动安排复习</p>' +
      '<button class="btn primary" data-go="search">去找一首诗</button></div>';
    return;
  }
  var html = '';
  for (var i = 0; i < q.length; i++) {
    var it = q[i], p = it.poem, e = it.entry;
    var late = it.overdue > 0;
    var tag = late
      ? '<span class="tag late">逾期 ' + it.overdue + ' 天</span>'
      : '<span class="tag today">今天该复习</span>';
    var stageTag = e.stage >= 4 ? '<span class="tag master">已掌握</span>' : '<span class="tag">' + STAGE_NAME[e.stage] + '</span>';
    html += '<div class="rev' + (late ? ' late' : '') + '">' +
      '<div class="rev-main" data-open="' + p.id + '">' +
        '<div class="rev-t">' + esc(p.t) + tag + stageTag + '</div>' +
        '<div class="rev-s">' + esc(p.d) + ' · ' + esc(p.a) + ' · ' + esc(p.lines[0]) + '</div>' +
      '</div>' +
      '<div class="rev-act">' +
        '<button class="btn sm" data-open="' + p.id + '">看原文</button>' +
        '<button class="btn sm" data-again="' + p.id + '">还不熟</button>' +
        '<button class="btn primary sm" data-ok="' + p.id + '">记住了</button>' +
      '</div></div>';
  }
  box.innerHTML = html;
}

function renderSearch(){
  var list = searchResult();
  var q = state.q.trim();
  var lbl = { all: '题库共', '小学': '小学共', '初中': '初中共', learned: '已学习', master: '已掌握' };
  byId('resMeta').textContent = q
    ? '找到 ' + list.length + ' 首相关诗词'
    : (lbl[state.filter] || '题库共') + ' ' + list.length + ' 首';

  var box = byId('resList');
  if (!list.length) {
    box.innerHTML = '<div class="card empty" style="grid-column:1/-1"><h3>没有找到相关诗词</h3>' +
      '<p>换个关键词试试：诗名、作者名，或诗中的一句</p></div>';
    return;
  }
  var html = '';
  for (var i = 0; i < list.length; i++) {
    var p = list[i];
    var mark = state.learned[p.id] ? '<span class="learned-dot" title="已加入题库"></span>' : '';
    html += '<div class="res" data-open="' + p.id + '">' + mark +
      '<div class="res-t">' + hl(p.t, q) + '</div>' +
      '<div class="res-a">' + esc(p.d) + ' · ' + hl(p.a, q) + ' · ' + esc(p.g) + '</div>' +
      '<div class="res-l">' + hl(p.lines.join(''), q) + '</div></div>';
  }
  box.innerHTML = html;
}

function renderLibrary(){
  var arr = [];
  for (var k in state.learned) {
    var p = findPoem(+k);
    if (p) arr.push({ poem: p, entry: state.learned[k] });
  }
  arr.sort(function(a, b){ return a.entry.next < b.entry.next ? -1 : 1; });

  var c = counts();
  var pct = Math.round(c.learned / TOTAL * 100);
  byId('libBig').innerHTML = c.learned + '<small> / ' + TOTAL + ' 首</small>';
  byId('libSub').textContent = c.master > 0 ? '已掌握 ' + c.master + ' 首，待复习 ' + c.due + ' 首' : '学习进度';
  byId('ringPct').textContent = pct + '%';
  byId('ringArc').setAttribute('stroke-dashoffset', String(201 - 201 * pct / 100));
  byId('libCount').textContent = arr.length ? '共 ' + arr.length + ' 首' : '';

  var box = byId('libList');
  if (!arr.length) {
    box.innerHTML = '<div class="card empty"><h3>题库还是空的</h3>' +
      '<p>在「查找诗词」里打开任意一首，点「加入学习题库」即可收藏并安排复习</p>' +
      '<button class="btn primary" data-go="search">去挑一首</button></div>';
    return;
  }
  var t = todayStr();
  var html = '';
  for (var i = 0; i < arr.length; i++) {
    var it = arr[i], p = it.poem, e = it.entry;
    var status = e.next <= t
      ? '<b>待复习</b>' + (e.next < t ? '（逾期 ' + diffDays(e.next, t) + ' 天）' : '（今天）')
      : '下次复习 ' + cnDate(e.next);
    var w = Math.min(100, Math.round(e.stage / 5 * 100));
    html += '<div class="lib-item">' +
      '<div class="m" data-open="' + p.id + '">' +
        '<div class="t">' + esc(p.t) + (e.stage >= 4 ? ' <span class="tag master">已掌握</span>' : '') + '</div>' +
        '<div class="s">' + esc(p.d) + ' · ' + esc(p.a) + ' · ' + status + ' · 已复习 ' + e.reviews + ' 次</div>' +
        '<div class="prog"><i style="width:' + w + '%"></i></div>' +
      '</div>' +
      '<button class="btn sm" data-open="' + p.id + '">打开</button>' +
    '</div>';
  }
  box.innerHTML = html;
}

/* 详情：只渲染当前打开的诗词，不触发其它渲染函数 */
function renderDetail(){
  var p = findPoem(state.openId);
  if (!p) return;
  byId('dTitle').textContent = p.t;
  byId('dMeta').innerHTML = '<span>' + esc(p.d) + '</span><span>' + esc(p.a) + '</span><span>' + esc(p.g) + '</span>';

  var html = '';
  for (var i = 0; i < p.lines.length; i++) {
    var line = p.lines[i], py = p.py[i], inner = '';
    for (var j = 0; j < line.length; j++) {
      var ch = line.charAt(j);
      inner += '<span class="ch"><span class="py">' + (py[j] ? esc(py[j]) : '') + '</span>' + esc(ch) + '</span>';
    }
    html += '<div class="pl"><div class="hz">' + inner + '</div>' +
      '<div class="tr">' + esc(p.tr[i] || '') + '</div></div>';
  }
  var poemBox = byId('dPoem');
  poemBox.innerHTML = html;
  poemBox.className = 'poem' + (state.showPy ? '' : ' hide-py') + (state.showTr ? '' : ' hide-tr');

  byId('dNote').textContent = p.note;
  byId('dIntro').textContent = p.intro;

  var e = entryOf(p.id);
  var tip = byId('dTip'), btn = byId('dLearn');
  if (e) {
    var t = todayStr();
    var when = e.next <= t ? (e.next < t ? '已逾期 ' + diffDays(e.next, t) + ' 天' : '今天该复习') : '下次复习 ' + cnDate(e.next);
    byId('dRecord').innerHTML = '第 ' + e.reviews + ' 次复习 · ' + STAGE_NAME[e.stage] + ' · ' + when;
    tip.textContent = '已在题库中';
    btn.textContent = '移出题库';
    btn.className = 'btn';
  } else {
    byId('dRecord').textContent = '还没有加入学习题库，加入后会按 1 / 2 / 4 / 7 / 15 天的节奏安排复习。';
    tip.textContent = '';
    btn.textContent = '加入学习题库';
    btn.className = 'btn primary';
  }
  byId('tgPy').textContent = state.showPy ? '拼音 开' : '拼音 关';
  byId('tgPy').className = 'btn sm' + (state.showPy ? ' tool-on' : '');
  byId('tgTr').textContent = state.showTr ? '译文 开' : '译文 关';
  byId('tgTr').className = 'btn sm' + (state.showTr ? ' tool-on' : '');
  byId('tgRead').textContent = (ttsSupported() && window.speechSynthesis.speaking) ? '停止' : '朗读';
}

/* 统一刷新入口（铁律：渲染函数互不调用，由这里统一调度） */
function refreshAll(){
  renderNav();
  renderToday();
  renderSearch();
  renderLibrary();
}

/* ============ 趣味练习 ============ */
var deck = { link: [], fill: [] };
var play = { mode: 'link', last: -1, item: null, answered: false, score: { correct: 0, streak: 0, best: 0 } };

function buildDeck(){
  var src = [];
  for (var k in state.learned){ var p = findPoem(+k); if (p) src.push(p); }
  if (!src.length) src = POEMS;            // 还没学就先拿全部题库练手
  var link = [], fill = [];
  for (var i = 0; i < src.length; i++){
    var p = src[i];
    for (var j = 0; j < p.lines.length - 1; j++) link.push({ poem: p, i: j });
    for (var m = 0; m < p.lines.length; m++){
      var line = p.lines[m], py = p.py[m];
      for (var n = 0; n < line.length; n++){
        if (py[n] && /[一-龥]/.test(line.charAt(n))) fill.push({ poem: p, i: m, pos: n });
      }
    }
  }
  deck.link = link; deck.fill = fill;
}

function ttsSupported(){ return ('speechSynthesis' in window); }
function zhVoice(){
  if (!ttsSupported()) return null;
  var vs = window.speechSynthesis.getVoices() || [];
  for (var i = 0; i < vs.length; i++){
    if (/zh|cmn|Chinese/i.test(vs[i].lang + vs[i].name)) return vs[i];
  }
  return null;
}
function speak(text){
  if (!ttsSupported()){ toast('当前环境不支持语音朗读'); return; }
  try {
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN'; u.rate = 0.85; u.pitch = 1;
    var v = zhVoice(); if (v) u.voice = v;
    window.speechSynthesis.speak(u);
  } catch (e) {}
}

function renderPlay(){
  buildDeck();
  var srcCount = 0; for (var k in state.learned) srcCount++;
  byId('playSrc').textContent = srcCount
    ? ('出题范围：已学习的 ' + srcCount + ' 首')
    : '还没加入题库，先用全部 ' + TOTAL + ' 首练习';
  play.last = -1;
  startRound();
}

function pickFrom(arr){
  if (!arr.length) return null;
  var idx;
  do { idx = Math.floor(Math.random() * arr.length); } while (arr.length > 1 && idx === play.last);
  play.last = idx;
  return arr[idx];
}

function startRound(){
  play.answered = false; play.item = null;
  var arr = play.mode === 'link' ? deck.link : deck.fill;
  var it = pickFrom(arr);
  if (!it){ byId('playCard').innerHTML = '<div class="play-empty">题库为空，加几首诗再来玩吧</div>'; return; }
  play.item = it;
  renderRound();
}

function normHan(s){ return (s || '').replace(/[^\u4e00-\u9fa5]/g, ''); }

function renderRound(){
  var it = play.item, card = byId('playCard');
  if (play.mode === 'link'){
    var poem = it.poem, up = poem.lines[it.i], down = poem.lines[it.i + 1];
    var upPy = poem.py[it.i].filter(Boolean).join(' ');
    card.innerHTML =
      '<div class="play-score"><span>本轮答对<b id="psCorrect">' + play.score.correct + '</b></span>' +
      '<span class="streak">连对<b id="psStreak">' + play.score.streak + '</b></span>' +
      '<span>最佳连对<b>' + play.score.best + '</b></span></div>' +
      '<div style="text-align:center;font-size:12px;color:var(--ink-3);margin-bottom:4px">上句（点「朗读上句」听一听）</div>' +
      '<div class="play-q">' + esc(up) + '<div class="sub">— ' + esc(poem.t) + ' · ' + esc(poem.a) + '</div></div>' +
      '<div class="play-py">' + esc(upPy) + '</div>' +
      '<div class="play-actions" style="margin-top:4px">' +
        '<button class="btn sm" id="btnReadUp"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg> 朗读上句</button>' +
      '</div>' +
      '<input class="play-input" id="playInput" placeholder="写出下一句" autocomplete="off" maxlength="40">' +
      '<div class="play-ans" id="playAns"></div>' +
      '<div class="play-actions">' +
        '<button class="btn primary" id="btnSubmit">提交</button>' +
        '<button class="btn" id="btnHint">提示首字</button>' +
        '<button class="btn" id="btnSkip">换一句</button>' +
      '</div>' +
      '<div class="play-foot">听上句 → 默写下句 → 提交。答错会显示正确答案；连对越多越有成就感。</div>';
    var inp = byId('playInput'); inp.focus();
    byId('btnReadUp').onclick = function(){ speak(up); };
    byId('btnSubmit').onclick = function(){ submitLink(down); };
    byId('btnHint').onclick = function(){ inp.value = normHan(down).charAt(0); inp.focus(); };
    byId('btnSkip').onclick = function(){ startRound(); };
    inp.onkeydown = function(e){ if (e.key === 'Enter') submitLink(down); };
  } else {
    var p2 = it.poem, line = p2.lines[it.i], py = p2.py[it.i];
    var ch = line.charAt(it.pos), chPy = py[it.pos];
    var shown = line.slice(0, it.pos) + '＿' + line.slice(it.pos + 1);
    card.innerHTML =
      '<div class="play-score"><span>本轮答对<b id="psCorrect">' + play.score.correct + '</b></span>' +
      '<span class="streak">连对<b id="psStreak">' + play.score.streak + '</b></span>' +
      '<span>最佳连对<b>' + play.score.best + '</b></span></div>' +
      '<div style="text-align:center;font-size:12px;color:var(--ink-3);margin-bottom:4px">补全空缺的字（' + esc(p2.t) + ' · ' + esc(p2.a) + '）</div>' +
      '<div class="play-q">' + esc(shown) + '<div class="sub">拼音提示：' + esc(chPy) + '</div></div>' +
      '<input class="play-input" id="playInput" placeholder="填一个字" autocomplete="off" maxlength="2">' +
      '<div class="play-ans" id="playAns"></div>' +
      '<div class="play-actions">' +
        '<button class="btn primary" id="btnSubmit">提交</button>' +
        '<button class="btn" id="btnSkip">换一句</button>' +
      '</div>' +
      '<div class="play-foot">根据拼音提示，把空缺的那个字补上。错了会显示正确答案。</div>';
    var inp2 = byId('playInput'); inp2.focus();
    byId('btnSubmit').onclick = function(){ submitFill(ch); };
    byId('btnSkip').onclick = function(){ startRound(); };
    inp2.onkeydown = function(e){ if (e.key === 'Enter') submitFill(ch); };
  }
}

function submitLink(down){
  if (play.answered){ startRound(); return; }
  var inp = byId('playInput'), ans = byId('playAns');
  var val = normHan(inp.value), target = normHan(down);
  if (!val){ toast('先写点什么～'); return; }
  play.answered = true;
  if (val === target){
    play.score.correct++; play.score.streak++;
    if (play.score.streak > play.score.best) play.score.best = play.score.streak;
    inp.classList.add('ok');
    ans.className = 'play-ans ok'; ans.textContent = '✓ 正确！下一句：' + down;
    refreshScore();
    setTimeout(startRound, 1100);
  } else {
    play.score.streak = 0;
    inp.classList.add('bad');
    ans.className = 'play-ans'; ans.textContent = '正确答案：' + down + '（再听一遍上句巩固）';
    refreshScore();
    byId('btnSubmit').textContent = '下一句';
  }
}

function submitFill(ch){
  if (play.answered){ startRound(); return; }
  var inp = byId('playInput'), ans = byId('playAns');
  var val = (inp.value || '').trim();
  if (!val){ toast('填一个字吧'); return; }
  play.answered = true;
  if (val === ch){
    play.score.correct++; play.score.streak++;
    if (play.score.streak > play.score.best) play.score.best = play.score.streak;
    inp.classList.add('ok');
    ans.className = 'play-ans ok'; ans.textContent = '✓ 正确！';
    refreshScore();
    setTimeout(startRound, 1000);
  } else {
    play.score.streak = 0;
    inp.classList.add('bad');
    ans.className = 'play-ans'; ans.textContent = '正确答案：' + ch;
    refreshScore();
    byId('btnSubmit').textContent = '下一句';
  }
}

function refreshScore(){
  var c = byId('psCorrect'), s = byId('psStreak');
  if (c) c.textContent = play.score.correct;
  if (s) s.textContent = play.score.streak;
}

/* 详情页：整诗朗读 */
function readPoem(p){
  if (!ttsSupported()){ toast('当前环境不支持语音朗读'); return; }
  var lines = p.lines.map(function(l){ return l.replace(/[，。？！、；：]/g, ''); });
  var i = 0;
  function next(){
    if (i >= lines.length){ byId('tgRead').textContent = '朗读'; return; }
    var u = new SpeechSynthesisUtterance(lines[i]);
    u.lang = 'zh-CN'; u.rate = 0.8; u.pitch = 1;
    var v = zhVoice(); if (v) u.voice = v;
    u.onend = function(){ i++; setTimeout(next, 350); };
    window.speechSynthesis.speak(u);
  }
  next();
}

/* ============ 事件 ============ */
function switchView(name){
  if (name !== 'play' && ttsSupported()) window.speechSynthesis.cancel();
  var views = document.querySelectorAll('.view');
  for (var i = 0; i < views.length; i++) views[i].classList.remove('on');
  byId('view-' + name).classList.add('on');
  var titles = { today: '今日复习', search: '查找诗词', library: '学习题库', play: '趣味练习' };
  byId('viewTitle').textContent = titles[name] || '';
  var navs = document.querySelectorAll('.nav-btn, .tab');
  for (var j = 0; j < navs.length; j++) {
    navs[j].classList.toggle('on', navs[j].getAttribute('data-view') === name);
  }
  if (name === 'play') renderPlay();
  window.scrollTo(0, 0);
}

function openDetail(id){
  state.openId = id;
  renderDetail();
  byId('mask').classList.add('on');
  document.body.style.overflow = 'hidden';
}

function closeDetail(){
  byId('mask').classList.remove('on');
  document.body.style.overflow = '';
  state.openId = null;
  if (ttsSupported()) window.speechSynthesis.cancel();
}

function toast(msg){
  var el = byId('toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(el._t);
  el._t = setTimeout(function(){ el.classList.remove('on'); }, 1900);
}

function addToLibrary(id){
  if (state.learned[id]) return;
  var t = todayStr();
  state.learned[id] = { added: t, stage: 0, reviews: 0, last: null, next: addDays(t, 1) };
  saveState();
  refreshAll();
  renderDetail();
  toast('已加入学习题库，明天开始复习');
}

function removeFromLibrary(id){
  delete state.learned[id];
  saveState();
  refreshAll();
  renderDetail();
  toast('已移出题库');
}

function markReview(id, ok){
  var e = state.learned[id];
  if (!e) return;
  var t = todayStr();
  if (ok) {
    e.stage = Math.min(e.stage + 1, 5);
    e.reviews = e.reviews + 1;
    e.last = t;
    e.next = addDays(t, STAGE_DAYS[Math.min(e.stage, 5)]);
  } else {
    e.stage = 0;
    e.reviews = e.reviews + 1;
    e.last = t;
    e.next = addDays(t, 1);
  }
  saveState();
  refreshAll();
  toast(ok ? '复习完成，' + cnDate(e.next) + '再见' : '没关系，明天再复习一次');
}

function exportJSON(){
  var payload = { app: 'gushi-workbench', v: 1, exported: new Date().toISOString(), learned: state.learned };
  var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = '古诗词学习备份_' + todayStr() + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1200);
  toast('备份已导出');
}

function importJSON(file){
  var reader = new FileReader();
  reader.onload = function(){
    try {
      var d = JSON.parse(reader.result);
      var src = d.learned || d;
      var n = 0;
      for (var k in src) {
        if (!findPoem(+k)) continue;
        if (!src[k] || typeof src[k] !== 'object') continue;
        state.learned[k] = normEntry(src[k]);
        n++;
      }
      saveState();
      refreshAll();
      toast('已导入 ' + n + ' 首诗词记录');
    } catch (e) {
      toast('文件格式不对，导入失败');
    }
  };
  reader.readAsText(file);
}

function bind(){
  // 导航
  var navs = document.querySelectorAll('.nav-btn, .tab');
  for (var i = 0; i < navs.length; i++) {
    navs[i].addEventListener('click', function(){ switchView(this.getAttribute('data-view')); });
  }

  // 搜索
  var q = byId('q');
  q.addEventListener('input', function(){
    state.q = this.value;
    byId('clearQ').classList.toggle('on', !!this.value);
    renderSearch();
  });
  byId('clearQ').addEventListener('click', function(){
    byId('q').value = '';
    state.q = '';
    this.classList.remove('on');
    renderSearch();
    byId('q').focus();
  });
  var chips = document.querySelectorAll('#chips .chip');
  for (var j = 0; j < chips.length; j++) {
    chips[j].addEventListener('click', function(){
      for (var k = 0; k < chips.length; k++) chips[k].classList.remove('on');
      this.classList.add('on');
      state.filter = this.getAttribute('data-f');
      renderSearch();
    });
  }

  // 列表点击（事件委托）
  document.addEventListener('click', function(ev){
    var el = ev.target;
    while (el && el !== document.body) {
      if (el.hasAttribute && el.hasAttribute('data-open')) { openDetail(+el.getAttribute('data-open')); return; }
      if (el.hasAttribute && el.hasAttribute('data-ok')) { markReview(+el.getAttribute('data-ok'), true); return; }
      if (el.hasAttribute && el.hasAttribute('data-again')) { markReview(+el.getAttribute('data-again'), false); return; }
      if (el.hasAttribute && el.hasAttribute('data-go')) { switchView(el.getAttribute('data-go')); return; }
      el = el.parentNode;
    }
  });

  // 详情
  byId('dClose').addEventListener('click', closeDetail);
  byId('mask').addEventListener('click', function(ev){ if (ev.target === this) closeDetail(); });
  document.addEventListener('keydown', function(ev){ if (ev.key === 'Escape') closeDetail(); });

  byId('tgPy').addEventListener('click', function(){
    state.showPy = !state.showPy;
    byId('dPoem').classList.toggle('hide-py', !state.showPy);
    this.textContent = state.showPy ? '拼音 开' : '拼音 关';
    this.className = 'btn sm' + (state.showPy ? ' tool-on' : '');
  });
  byId('tgTr').addEventListener('click', function(){
    state.showTr = !state.showTr;
    byId('dPoem').classList.toggle('hide-tr', !state.showTr);
    this.textContent = state.showTr ? '译文 开' : '译文 关';
    this.className = 'btn sm' + (state.showTr ? ' tool-on' : '');
  });
  byId('dLearn').addEventListener('click', function(){
    if (state.openId == null) return;
    if (state.learned[state.openId]) removeFromLibrary(state.openId);
    else addToLibrary(state.openId);
  });
  byId('tgRead').addEventListener('click', function(){
    var p = findPoem(state.openId); if (!p) return;
    if (!ttsSupported()){ toast('当前环境不支持语音朗读'); return; }
    if (window.speechSynthesis.speaking){ window.speechSynthesis.cancel(); this.textContent = '朗读'; return; }
    this.textContent = '停止';
    readPoem(p);
  });

  // 趣味练习：模式切换
  var pm = document.querySelectorAll('#playMode .chip');
  for (var pi = 0; pi < pm.length; pi++){
    pm[pi].addEventListener('click', function(){
      for (var pk = 0; pk < pm.length; pk++) pm[pk].classList.remove('on');
      this.classList.add('on');
      play.mode = this.getAttribute('data-m');
      play.last = -1;
      play.score.correct = 0; play.score.streak = 0;
      startRound();
    });
  }

  // 备份
  byId('btnExport').addEventListener('click', exportJSON);
  byId('btnExport2').addEventListener('click', exportJSON);
  byId('btnImport').addEventListener('click', function(){ byId('fileInput').click(); });
  byId('btnImport2').addEventListener('click', function(){ byId('fileInput').click(); });
  byId('fileInput').addEventListener('change', function(){
    if (this.files && this.files[0]) importJSON(this.files[0]);
    this.value = '';
  });

  // 清空
  byId('btnClearAll').addEventListener('click', function(){
    if (!confirm('确定清空全部学习记录吗？此操作不可撤销，建议先导出备份。')) return;
    state.learned = {};
    state.demo = false;
    saveState();
    refreshAll();
    toast('已清空学习记录');
  });
  byId('btnClearDemo').addEventListener('click', function(){
    if (!confirm('清空示例数据，从头开始？')) return;
    state.learned = {};
    state.demo = false;
    saveState();
    refreshAll();
    toast('示例已清空，去挑第一首诗吧');
  });
}

/* ============ 启动 ============ */
document.addEventListener('DOMContentLoaded', function(){
  loadState();      // 1. 读数据（或写入示例）
  bind();           // 2. 绑定事件
  refreshAll();     // 3. 一次性渲染所有视图
});
</script>
</body>
</html>
